services:
  backend:
    build:
      context: ./backend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
    image: homework-upload-system-backend:local
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: sqlite+pysqlite:////data/homework.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-change-me-in-production}
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:-minglog}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-minglog666}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-luoming@minglog.cn}
      ADMIN_NAME: ${ADMIN_NAME:-minglog}
      SMTP_PROXY: ${SMTP_PROXY:-http://172.18.80.1:7890}
    command: >
      sh -c "python -m app.create_admin
      --account \"$$ADMIN_ACCOUNT\"
      --email \"$$ADMIN_EMAIL\"
      --name \"$$ADMIN_NAME\"
      && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-localhost,127.0.0.1,::1}
    image: homework-upload-system-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  backend_data:
