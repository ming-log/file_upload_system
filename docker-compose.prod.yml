services:
  backend:
    image: homework-upload-system-backend:local
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite+pysqlite:////data/homework.db}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      STORAGE_DIR: ${STORAGE_DIR:-/data/uploaded_files}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env.prod}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?set AUTH_SECRET_KEY in .env.prod}
      ADMIN_ACCOUNT: ${ADMIN_ACCOUNT:?set ADMIN_ACCOUNT in .env.prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env.prod}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env.prod}
      ADMIN_NAME: ${ADMIN_NAME:-系统管理员}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-auto}
      SMTP_ALLOW_INVALID_CERTS: ${SMTP_ALLOW_INVALID_CERTS:-false}
      SMTP_PROXY: ${SMTP_PROXY:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    command: >
      sh -c "python -m app.create_admin
      --account \"$$ADMIN_ACCOUNT\"
      --email \"$$ADMIN_EMAIL\"
      --name \"$$ADMIN_NAME\"
      --password \"$$ADMIN_PASSWORD\"
      && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data/backend:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: homework-upload-system-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
